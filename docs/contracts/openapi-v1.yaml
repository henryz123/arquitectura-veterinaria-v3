openapi: 3.1.0
info:
  title: Arquitectura - Veterinaria API
  version: 0.4.0-v1-integral-b05-c1-order-confirmation
  description: |
   Contrato de las rutas implementadas y verificadas de B01, B02, incrementos de B03
   B04, el catálogo público B05-A, el registro B05-B de pedidos PENDIENTE y
   la confirmación comercial B05-C1 contra el inventario compartido.
   Pagos, preparación, modificaciones, cancelaciones y devoluciones B05 permanecen pendientes.
   Todo dato de demostración es sintético.
servers:
  - url: https://demo.invalid
    description: Marcador de una URL aún no desplegada.
tags:
  - name: authentication
  - name: tenant-administration
  - name: owner-pet-care
  - name: appointment-management
  - name: inventory
  - name: storefront
  - name: online-orders
  - name: audit
  - name: notifications
paths:
  /api/v1/auth/tenants/{tenantSlug}/staff-sessions:
    post:
      tags: [authentication]
      summary: Inicia una sesión STAFF para el tenant solicitado
      x-implementation-status: implemented-g4-i01
      x-v1-requirements: [RF-AUT-01, RF-AUT-04, RF-AUT-05, RF-AUT-10]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/tenants/{tenantSlug}/client-sessions:
    post:
      tags: [authentication]
      summary: Inicia una sesión CLIENT para el tenant solicitado
      x-implementation-status: implemented-g4-i01
      x-v1-requirements: [RF-CLI-01, RF-CLI-02, RF-CLI-03, RF-CLI-04]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/saas-sessions:
    post:
      tags: [authentication]
      summary: Inicia una sesión administrativa SaaS sin contexto tenant
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/session:
    delete:
      tags: [authentication]
      summary: Revoca la sesión actual
      x-implementation-status: implemented-g4-i01
      x-v1-requirements: [RF-AUT-02, RF-AUT-13]
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
  /api/v1/auth/session-csrf-token:
    post:
      tags: [authentication]
      summary: Rota y devuelve un token CSRF para la sesión opaca vigente durante el bootstrap del navegador
      x-implementation-status: implemented-b01-csrf-reload
      security: [{ sessionCookie: [] }]
      parameters:
        - name: X-AV-CSRF-Bootstrap
          in: header
          required: true
          description: Cabecera de intención enviada solo por el cliente same-origin durante una restauración legítima.
          schema: { type: string, enum: ['1'] }
      responses:
        '200': { $ref: '#/components/responses/CsrfTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
  /api/v1/session-context:
    get:
      tags: [authentication]
      summary: Consulta el contexto mínimo de la sesión actual
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/SessionContextResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/tenant-profile/{tenantSlug}:
    get:
      tags: [tenant-administration]
      summary: Consulta el perfil del tenant propio
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      responses:
        '200': { $ref: '#/components/responses/TenantProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tenant-registrations:
    post:
      tags: [tenant-administration]
      summary: Registra una solicitud de veterinaria
      x-implementation-status: implemented-g4-i01
      x-v1-requirements: [RF-SAA-01, RF-SAA-02, RF-SAA-09, RF-SAA-11]
      requestBody: { $ref: '#/components/requestBodies/TenantRegistrationRequest' }
      responses:
        '201': { $ref: '#/components/responses/RegistrationCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenant-registrations/{registrationId}/resumptions:
    post:
      tags: [tenant-administration]
      summary: Reanuda una solicitud de veterinaria pendiente
      x-implementation-status: implemented-g4-i01
      parameters: [{ $ref: '#/components/parameters/RegistrationId' }]
      requestBody: { $ref: '#/components/requestBodies/RegistrationResumptionRequest' }
      responses:
        '202': { $ref: '#/components/responses/RegistrationAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/email-verifications:
    post:
      tags: [authentication]
      summary: Consume un enlace opaco de verificación de correo
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/OneTimeTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/VerificationCompleted' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenant-registrations/{registrationId}/initial-password:
    post:
      tags: [tenant-administration]
      summary: Define la contraseña inicial tras verificar el correo de registro
      x-implementation-status: implemented-g4-i01
      security: [{ registrationGrantCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/RegistrationId' }]
      requestBody: { $ref: '#/components/requestBodies/PasswordRequest' }
      responses:
        '201': { $ref: '#/components/responses/TenantActivated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenants/{tenantSlug}/client-registrations:
    post:
      tags: [tenant-administration]
      summary: Registra CLIENT; en demostración local autorizada puede activarse inmediatamente
      description: 'Con configuración normal la cuenta requiere verificación. Solo en la demostración local autorizada se devuelve ACTIVA.'
      x-implementation-status: implemented-g4-i01
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody: { $ref: '#/components/requestBodies/ClientRegistrationRequest' }
      responses:
        '201':
          description: Cuenta activa en modo de demostración local autorizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientRegistrationResultEnvelope' }
        '202':
          description: Cuenta pendiente de verificación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientRegistrationResultEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenants/{tenantSlug}/client-verification-resends:
    post:
      tags: [tenant-administration]
      summary: Reemite un enlace de verificación CLIENT sin revelar cuentas
      x-implementation-status: implemented-g4-i01
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody: { $ref: '#/components/requestBodies/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/password-recovery-requests:
    post:
      tags: [authentication]
      summary: Solicita un enlace opaco de recuperación de contraseña
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/PasswordRecoveryRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/password-recoveries:
    post:
      tags: [authentication]
      summary: Consume un enlace de recuperación y define una nueva contraseña
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/RecoveryCompletionRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/staff-accounts:
    get:
      tags: [tenant-administration]
      summary: Lista las cuentas STAFF del tenant de la sesión autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/StaffAccounts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/staff-invitations:
    post:
      tags: [tenant-administration]
      summary: Invita una cuenta STAFF con roles explícitos
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/StaffInvitationRequest' }
      responses:
        '201': { $ref: '#/components/responses/StaffInvitationCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/staff-invitations/acceptance:
    post:
      tags: [tenant-administration]
      summary: Acepta una invitación STAFF mediante enlace opaco
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/RecoveryCompletionRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/staff-accounts/{principalId}/roles:
    patch:
      tags: [tenant-administration]
      summary: Reemplaza los roles de una cuenta STAFF del mismo tenant
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PrincipalId' }]
      requestBody: { $ref: '#/components/requestBodies/StaffRolesRequest' }
      responses:
        '200': { $ref: '#/components/responses/StaffAccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/staff-accounts/{principalId}/deactivations:
    post:
      tags: [tenant-administration]
      summary: Desactiva una cuenta STAFF del mismo tenant
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PrincipalId' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tenants:
    get:
      tags: [tenant-administration]
      summary: Lista organizaciones para una sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Organizations' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/tenants/{tenantId}/suspensions:
    post:
      tags: [tenant-administration]
      summary: Suspende una organización mediante sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody: { $ref: '#/components/requestBodies/TenantStatusChangeRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenants/{tenantId}/reactivations:
    post:
      tags: [tenant-administration]
      summary: Reactiva una organización mediante sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody: { $ref: '#/components/requestBodies/TenantStatusChangeRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/ruc-reviews:
    post:
      tags: [tenant-administration]
      summary: Solicita la revisión de un RUC sin requerir sesión
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/RucReviewRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [tenant-administration]
      summary: Lista revisiones de RUC para una sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/RucReviews' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/ruc-reviews/{reviewId}:
    patch:
      tags: [tenant-administration]
      summary: Resuelve una revisión de RUC con sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ReviewId' }]
      requestBody: { $ref: '#/components/requestBodies/RucReviewResolutionRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenants/{tenantSlug}/administrative-recoveries:
    post:
      tags: [tenant-administration]
      summary: Solicita recuperación administrativa sin requerir sesión
      x-implementation-status: implemented-g4-i01
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody: { $ref: '#/components/requestBodies/AdministrativeRecoveryRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/administrative-recoveries:
    get:
      tags: [tenant-administration]
      summary: Lista recuperaciones administrativas para una sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdministrativeRecoveries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/administrative-recoveries/{recoveryId}:
    patch:
      tags: [tenant-administration]
      summary: Revisa una recuperación administrativa mediante sesión SaaS
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/RecoveryId' }]
      requestBody: { $ref: '#/components/requestBodies/AdministrativeRecoveryReviewRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/client-space:
    get:
      tags: [tenant-administration]
      summary: Consulta el espacio mínimo de una sesión CLIENT
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/ClientSpaceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/schedule/assignable-professionals:
    get:
      tags: [appointment-management]
      summary: Lista la proyección mínima de profesionales asignables del tenant de la sesión
      description: No acepta tenant ni identidad de profesional desde el cliente. PostgreSQL revalida la sesión opaca, el tenant, los roles del solicitante y el estado de cada profesional.
      x-implementation-status: implemented-b03-foundation
      x-v1-requirements: [RF-B03-002, RF-B03-004]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AssignableProfessionalsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/schedule/my-agenda:
    get:
      tags: [appointment-management]
      summary: Lista la agenda clínica mínima asignada al VETERINARIO autenticado
      description: Proyección de solo lectura para el panel operativo del VETERINARIO. No expone contactos de propietarios ni narrativa clínica; el tenant y el profesional se derivan exclusivamente de la sesión.
      x-implementation-status: implemented-b06-c
      x-v1-requirements: [RF-B03-016, RF-B06-009]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/ProfessionalAgendaResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/schedule/services:
    get:
      tags: [appointment-management]
      summary: Lista los servicios configurados en el tenant de la sesión
      x-implementation-status: implemented-b03-services-availability
      x-v1-requirements: [RF-B03-002]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OfferedServicesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [appointment-management]
      summary: Crea un servicio clínico o grooming para el tenant de la sesión
      x-implementation-status: implemented-b03-services-availability
      x-v1-requirements: [RF-B03-002]
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OfferedServiceRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/OfferedServiceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/schedule/services/{serviceId}:
    put:
      tags: [appointment-management]
      summary: Actualiza los datos editables de un servicio sin cambiar su clasificación
      x-implementation-status: implemented-b03-services-availability
      x-v1-requirements: [RF-B03-002]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OfferedServiceUpdateRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/OfferedServiceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/schedule/operating-hours:
    get:
      tags: [appointment-management]
      summary: Lista franjas semanales locales de operación de la veterinaria
      x-implementation-status: implemented-b03-services-availability
      x-v1-requirements: [RF-B03-001]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/OperatingHoursResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [appointment-management]
      summary: Registra una franja semanal local de operación de la veterinaria
      x-implementation-status: implemented-b03-services-availability
      x-v1-requirements: [RF-B03-001]
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WeeklyHoursRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/OperatingHoursItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/schedule/professional-availability:
    get:
      tags: [appointment-management]
      summary: Lista franjas semanales de profesionales asignables del tenant
      x-implementation-status: implemented-b03-services-availability
      x-v1-requirements: [RF-B03-001, RF-B03-008, RF-B03-010]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/ProfessionalAvailabilityResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [appointment-management]
      summary: Registra disponibilidad para un profesional activo con rol asignable
      x-implementation-status: implemented-b03-services-availability
      x-v1-requirements: [RF-B03-001, RF-B03-008, RF-B03-010]
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfessionalAvailabilityRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/ProfessionalAvailabilityItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/schedule/blocks:
    get:
      tags: [appointment-management]
      summary: Lista bloqueos excepcionales y ausencias del tenant autorizado
      x-implementation-status: implemented-b03-blocks-no-show
      x-v1-requirements: [RF-B03-001, RF-B03-014]
      security: [{ sessionCookie: [] }]
      responses:
